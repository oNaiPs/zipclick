name: Release

# Pushing a tag v* builds both executables from that commit and drafts a
# GitHub release with them. Nothing is published until the draft is
# published by hand. The SignPath step is ready for when the project has
# code signing; SignPath turned it down for now (too few users yet).
#
# Actions are pinned to commits, not tags: this job can write releases, and
# a moved tag would run someone else's code with that permission.
#
# Signing runs once the repository variable SIGNPATH_ORGANIZATION_ID and the
# secret SIGNPATH_API_TOKEN exist; before that the draft gets unsigned files.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check
        run: ./check.sh

      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ./build.sh "$GITHUB_REF_NAME"; else ./build.sh; fi
          mkdir out
          cp dist/zipclick-amd64.exe out/ZipClick.exe
          cp dist/zipclick-arm64.exe out/ZipClick-arm64.exe

      - name: Upload for signing
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zipclick-unsigned
          path: out/

      - name: Sign
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: zipclick
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          cp out/ZipClick.exe "out/zipclick-$v-x64.exe"
          cp out/ZipClick-arm64.exe "out/zipclick-$v-arm64.exe"
          # checkout can leave the tag lightweight; the notes are its message.
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "ZipClick $v" --notes-file notes.md out/*.exe
